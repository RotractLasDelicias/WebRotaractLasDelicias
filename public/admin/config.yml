local_backend: true 
backend:
  name: github
  repo: RotractLasDelicias/WebRotaractLasDelicias
  branch: main
publish_mode: editorial_workflow

media_folder: "public/images"
public_folder: "/images"

collections:
  # 1. RECURSOS PÁGINA PRINCIPAL (Hero Swiper)
  - name: "principalpage"
    label: "Página Principal (Hero)"
    files:
      - name: "hero"
        label: "Configuración del Hero / Swiper"
        file: "content/principalpage/hero.json"
        fields:
          - { label: "Título Principal", name: "title", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - label: "Imágenes del Swiper / Slider"
            name: "slides"
            widget: "list"
            summary: "{{fields.image}}"
            field: { label: "Imagen", name: "image", widget: "image" }

  # 2. CONTADORES / ESTADÍSTICAS (Archivo único tipo File Collection)
  - name: "metrics"
    label: "Métricas / Contadores"
    files:
      - name: "counters"
        label: "Contadores de Impacto"
        file: "content/metrics/counters.json"
        fields:
          - { label: "Número de Beneficiados", name: "beneficiariesCount", widget: "number", value_type: "int" }
          - { label: "Socios Activos", name: "activePartnersCount", widget: "number", value_type: "int" }
          - { label: "Proyectos Realizados", name: "completedProjectsCount", widget: "number", value_type: "int" }

  # 3. PROYECTOS
  - name: "projects"
    label: "Proyectos"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título del Proyecto", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string", hint: "Ej: proyecto-salud-comunitaria" }
      - { label: "Comité (Categoría)", name: "committee", widget: "select", options: ["Servicio a la Comunidad", "Desarrollo Profesional", "Finanzas", "Relaciones Internacionales", "Servicios Internos"] }
      - { label: "Descripción", name: "description", widget: "text" }
      - label: "Galería de Imágenes"
        name: "images"
        widget: "list"
        field: { label: "Imagen", name: "image", widget: "image" }

  # 4. JUNTA DIRECTIVA Y PRESIDENTES DE COMITÉ
  - name: "leadership"
    label: "Junta Directiva y Presidentes"
    folder: "content/leadership"
    create: true
    slug: "{{fields.name}}"
    fields:
      - { label: "Nombre Completo", name: "name", widget: "string" }
      - label: "Tipo de Cargo"
        name: "category"
        widget: "select"
        options:
          - { label: "Junta Directiva", value: "directiva" }
          - { label: "Presidente de Comité", value: "presidente_comite" }
      - { label: "Rol / Cargo", name: "role", widget: "string", hint: "Ej: Presidente, Tesorero, Presidente de Finanzas" }
      - { label: "Fotografía", name: "image", widget: "image" }
      - { label: "Biografía", name: "bio", widget: "text", required: false }
      - { label: "Mensaje / Frase", name: "message", widget: "text", required: false }

  # 5. PRÓXIMOS PLANES / EVENTOS
  - name: "plans"
    label: "Próximos Planes"
    folder: "content/plans"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título del Plan", name: "title", widget: "string" }
      - { label: "Comité (Categoría)", name: "committee", widget: "select", options: ["Servicio a la Comunidad", "Desarrollo Profesional", "Finanzas", "Relaciones Internacionales", "Servicios Internos"] }
      - { label: "Fecha y Hora", name: "date", widget: "datetime" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Imagen / Banner", name: "image", widget: "image" }

  # 6. ALIADOS / PARTNERS
  - name: "partners"
    label: "Aliados"
    folder: "content/partners"
    create: true
    slug: "{{fields.name}}"
    fields:
      - { label: "Nombre del Aliado", name: "name", widget: "string" }
      - { label: "Logo / Imagen", name: "image", widget: "image" }